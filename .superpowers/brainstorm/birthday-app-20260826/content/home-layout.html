<h2>首页优先展示什么？</h2>
<p class="subtitle">点击你更喜欢的首页信息结构</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>生日主卡片</h3>
      <p>顶部突出显示下次生日倒计时，下方是纪念日列表。</p>
      <div class="mockup">
        <div class="mockup-header">我的生日</div>
        <div class="mockup-body"><h3>还有 86 天 04:12:09</h3><p>2026 年 11 月 20 日</p><hr><p>纪念日 · 3 条</p></div>
      </div>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>时间轴列表</h3>
      <p>生日和所有纪念日使用统一列表，每条都显示实时计时。</p>
      <div class="mockup">
        <div class="mockup-header">时间记录</div>
        <div class="mockup-body"><p>🎂 生日　还有 86 天</p><p>❤️ 在一起　2 年 41 天</p><p>🏠 搬家　312 天</p></div>
      </div>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>双区仪表盘</h3>
      <p>生日倒计时和纪念日正计时并列展示，信息更完整。</p>
      <div class="mockup">
        <div class="mockup-header">今日</div>
        <div class="mockup-body"><div style="display:flex;gap:8px"><div class="placeholder" style="flex:1">生日倒计时</div><div class="placeholder" style="flex:1">纪念日计时</div></div></div>
      </div>
    </div>
  </div>
</div>
